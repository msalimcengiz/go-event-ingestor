apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor-api
  labels: { app: ingestor, role: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ingestor, role: api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: ingestor, role: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/msalimcengiz/go-event-ingestor
          args: ["api"]
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: ingestor }
            - secretRef: { name: ingestor-db }
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: ingestor-api
spec:
  selector: { app: ingestor, role: api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestor-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ingestor-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingestor-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ingestor, role: api }
