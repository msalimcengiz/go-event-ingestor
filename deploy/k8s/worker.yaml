apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor-worker
  labels: { app: ingestor, role: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ingestor, role: worker }
  template:
    metadata:
      labels: { app: ingestor, role: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      # Long enough for the final batch to flush after SIGTERM.
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/msalimcengiz/go-event-ingestor
          args: ["worker"]
          ports: [{ name: metrics, containerPort: 9091 }]
          env:
            - name: HTTP_ADDR
              value: ":9091"
            # Pod name = stable consumer name inside the Redis consumer group.
            - name: CONSUMER_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          envFrom:
            - configMapRef: { name: ingestor }
            - secretRef: { name: ingestor-db }
          resources:
            requests: { cpu: 200m, memory: 96Mi }
            limits: { memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
